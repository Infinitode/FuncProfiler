name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tooling
      run: python -m pip install --upgrade build

    - name: Run the test suite
      run: python -m unittest test -v

    - name: Stamp the tag version into the package
      run: |
        sed -i "s/{{VERSION_PLACEHOLDER}}/${GITHUB_REF_NAME#v}/g" setup.py
        sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" funcprofiler/__init__.py

    - name: Show the release version
      run: |
        grep -n "^    version=" setup.py
        grep -n "^__version__" funcprofiler/__init__.py

    - name: Build sdist and wheel
      run: python -m build

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
